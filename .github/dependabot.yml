# Weekly, grouped so a week with several updates opens at most one pull
# request per ecosystem. cooldown holds a version back until it has been
# published for this many days, so a version is not proposed the day a
# compromised maintainer account or build system pushes it.
# github-actions supports only default-days; gomod supports a split per
# semver bump.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      gomod:
        patterns:
          - "*"
