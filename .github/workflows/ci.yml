name: ci

on:
  push:
  pull_request:

# Read-only by default; no job here needs to write to the repository or to
# packages.
permissions:
  contents: read

# One run per ref at a time. A branch's superseded push is cancelled, but a
# tag, the main branch, and a scheduled run are never cancelled mid-run.
# github.ref is compared against the literal refs/heads/main because
# github.event.repository.default_branch is empty on a schedule event.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

# GOTOOLCHAIN=local forbids a silent switch to a different toolchain than
# the one setup-go installed from go.mod.
env:
  GOTOOLCHAIN: local

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: git --version
      - run: go vet -tags integration ./...
      - run: go vet -tags faultinject ./...
      - run: go test -race -count=1 ./...
      - name: crash recovery (fault injection)
        run: go test -tags faultinject -count=1 ./internal/manifest/ ./internal/proposal/
      - name: quick start smoke (no engine)
        run: |
          go run ./cmd/repo-steward fixture list
          go run ./cmd/repo-steward fixture setup patch-safe -dest "$RUNNER_TEMP/patch-safe"
          go run ./cmd/repo-steward fixture proxy -dest "$RUNNER_TEMP/proxy"
          go run ./cmd/repo-steward fixture vulndb -dest "$RUNNER_TEMP/vulndb"
          go run ./cmd/repo-steward snapshot build "$RUNNER_TEMP/patch-safe" -dest "$RUNNER_TEMP/patch-safe-snapshot"

  # Container-backed tests. They share one engine, and the inspect workflow
  # reaps every labelled container, so packages run serially (-p 1). The
  # pinned image is pulled once here; the tests themselves never pull. The
  # vulnerability tests build govulncheck once through proxy.golang.org and
  # sum.golang.org, and one of them fetches https://vuln.go.dev.
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: docker version
      - name: pull pinned toolchain image
        run: docker pull golang@sha256:3d699e4d15d0f8f13c9195c0632a16702b8cbdece2955af1c23b37ae5d55a253
      - run: go test -tags integration -count=1 -p 1 -timeout 30m ./...
      - name: inspect a fixture end to end
        run: |
          go run ./cmd/repo-steward fixture setup patch-safe -dest "$RUNNER_TEMP/patch-safe"
          go run ./cmd/repo-steward fixture proxy -dest "$RUNNER_TEMP/proxy"
          go run ./cmd/repo-steward inspect "$RUNNER_TEMP/patch-safe" -data-dir "$RUNNER_TEMP/data" -fixture-proxy "$RUNNER_TEMP/proxy" | tee "$RUNNER_TEMP/report.json"
          grep -q '"outcome": "ok"' "$RUNNER_TEMP/report.json"
      - name: baseline maintain on fixtures
        # A built binary is used so the program's own exit status is
        # observable; go run reports every non-zero exit as 1.
        run: |
          go build -o "$RUNNER_TEMP/repo-steward" ./cmd/repo-steward
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/patch-safe" -mode baseline -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-ps" -fixture-proxy "$RUNNER_TEMP/proxy" | tee "$RUNNER_TEMP/ps.json"
          grep -q '"outcome": "proposal_prepared"' "$RUNNER_TEMP/ps.json"
          "$RUNNER_TEMP/repo-steward" fixture setup breaking-minor -dest "$RUNNER_TEMP/breaking-minor"
          set +e
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/breaking-minor" -mode baseline -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-bm" -fixture-proxy "$RUNNER_TEMP/proxy" > "$RUNNER_TEMP/bm.json"; rc=$?
          set -e
          test "$rc" = 4
          grep -q '"outcome": "regressed"' "$RUNNER_TEMP/bm.json"
      - name: vulnerability report on fixtures
        # Report only: the planted advisory exits 4, the scanner built in
        # the tool profile is reused on the second run, and a scan that
        # cannot finish is inconclusive and exits 3.
        run: |
          "$RUNNER_TEMP/repo-steward" fixture vulndb -dest "$RUNNER_TEMP/vulndb"
          set +e
          "$RUNNER_TEMP/repo-steward" vulns "$RUNNER_TEMP/patch-safe" -data-dir "$RUNNER_TEMP/data-vulns" -fixture-proxy "$RUNNER_TEMP/proxy" -vulndb "$RUNNER_TEMP/vulndb" > "$RUNNER_TEMP/vulns.json"; rc=$?
          set -e
          test "$rc" = 4
          grep -q '"id": "GO-TEST-0001"' "$RUNNER_TEMP/vulns.json"
          grep -q '"call_path": "app.main (main.go:10) -\\u003e lib.Greet"' "$RUNNER_TEMP/vulns.json"
          set +e
          "$RUNNER_TEMP/repo-steward" vulns "$RUNNER_TEMP/patch-safe" -data-dir "$RUNNER_TEMP/data-vulns" -fixture-proxy "$RUNNER_TEMP/proxy" -vulndb "$RUNNER_TEMP/vulndb" -scan-timeout 1ms > "$RUNNER_TEMP/vulns-timeout.json"; rc=$?
          set -e
          test "$rc" = 3
          grep -q '"built_this_run": false' "$RUNNER_TEMP/vulns-timeout.json"
          grep -q '"reason": "scanner timed out"' "$RUNNER_TEMP/vulns-timeout.json"
      - name: vulnerable selection on fixtures
        # maintain -select vulnerable through the command line: the advisory
        # fix is proposed and exits 0, an advisory with no fix exits 4, and
        # an agent mode refuses the flag with exit 1 before anything runs.
        # The data directory of the previous step already holds the scanner.
        run: |
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/patch-safe" -mode baseline -select vulnerable -vulndb "$RUNNER_TEMP/vulndb" -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-vulns" -fixture-proxy "$RUNNER_TEMP/proxy" > "$RUNNER_TEMP/vsel.json"
          grep -q '"outcome": "proposal_prepared"' "$RUNNER_TEMP/vsel.json"
          grep -q 'GO-TEST-0001' "$RUNNER_TEMP/vsel.json"
          grep -q '"resolved": \[' "$RUNNER_TEMP/vsel.json"
          "$RUNNER_TEMP/repo-steward" fixture setup moved-package -dest "$RUNNER_TEMP/moved-package"
          set +e
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/moved-package" -mode baseline -select vulnerable -vulndb "$RUNNER_TEMP/vulndb" -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-vulns" -fixture-proxy "$RUNNER_TEMP/proxy" > "$RUNNER_TEMP/vnofix.json"; rc=$?
          set -e
          test "$rc" = 4
          grep -q '"outcome": "no_fix_available"' "$RUNNER_TEMP/vnofix.json"
          set +e
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/patch-safe" -mode scripted -scenario S1 -select vulnerable -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-vulns" -fixture-proxy "$RUNNER_TEMP/proxy" 2> "$RUNNER_TEMP/vrefuse.txt"; rc=$?
          set -e
          test "$rc" = 1
          grep -q 'not yet supported in -mode scripted' "$RUNNER_TEMP/vrefuse.txt"
      - name: scripted agent scenarios
        run: |
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/breaking-minor" -mode scripted -scenario S2 -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-s2" -fixture-proxy "$RUNNER_TEMP/proxy" | tee "$RUNNER_TEMP/s2.json"
          grep -q '"outcome": "proposal_prepared"' "$RUNNER_TEMP/s2.json"
          "$RUNNER_TEMP/repo-steward" fixture setup test-uses-old-api -dest "$RUNNER_TEMP/s8"
          set +e
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/s8" -mode scripted -scenario S8 -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-s8" -fixture-proxy "$RUNNER_TEMP/proxy" > "$RUNNER_TEMP/s8.json"; rc=$?
          set -e
          test "$rc" = 4
          grep -q '"outcome": "blocked"' "$RUNNER_TEMP/s8.json"
      - name: model mode from recordings (no model server)
        run: |
          OLLAMA_HOST=127.0.0.1:1 "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/breaking-minor" -mode model -model ollama:qwen3:30b-a3b -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-replay" -fixture-proxy "$RUNNER_TEMP/proxy" -replay internal/steward/testdata/recordings/qwen3-30b-a3b/breaking-minor | tee "$RUNNER_TEMP/replay.json"
          grep -q '"outcome": "proposal_prepared"' "$RUNNER_TEMP/replay.json"
      - name: publication tests (fake API, bare repository, fault-injected binary)
        run: go test -tags integration -count=1 -p 1 -run 'TestCLI_Publication|TestPublish|TestReconcile' ./internal/steward/ ./internal/publish/
      - name: approval across processes
        run: |
          set +e
          "$RUNNER_TEMP/repo-steward" maintain "$RUNNER_TEMP/breaking-minor" -mode scripted -scenario S10 -author "CI <ci@example.invalid>" -data-dir "$RUNNER_TEMP/data-s10" -fixture-proxy "$RUNNER_TEMP/proxy" -scope-files-soft 1 -scope-files-hard 3 > "$RUNNER_TEMP/s10.json"; rc=$?
          set -e
          test "$rc" = 5
          RUN=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/s10.json'))['run_id'])")
          "$RUNNER_TEMP/repo-steward" approve "$RUN" -data-dir "$RUNNER_TEMP/data-s10" -note ci
          "$RUNNER_TEMP/repo-steward" resume "$RUN" -data-dir "$RUNNER_TEMP/data-s10" -fixture-proxy "$RUNNER_TEMP/proxy" | tee "$RUNNER_TEMP/s10r.json"
          grep -q '"outcome": "proposal_prepared"' "$RUNNER_TEMP/s10r.json"
